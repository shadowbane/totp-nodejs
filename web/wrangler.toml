# Tick (totp.devhelper.my.id), served by Workers Assets.
# `name` must match the Git-connected Worker in Cloudflare (Workers Builds:
# root directory `web`, build `pnpm install --frozen-lockfile && pnpm build`,
# deploy `npx wrangler deploy`).
name = "totp-nodejs"
compatibility_date = "2024-01-01"

# public/_headers sets the CSP and other security headers.
# /terms and /privacy fall back to index.html; the app picks the page.
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
