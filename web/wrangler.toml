# Tick (totp.devhelper.my.id), served by Workers Assets.
# If the live Worker has another name, change `name` to match it before
# deploying, or attach totp.devhelper.my.id to this new Worker afterwards.
name = "tick"
compatibility_date = "2024-01-01"

# public/_headers sets the CSP and other security headers.
# /terms and /privacy fall back to index.html; the app picks the page.
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
